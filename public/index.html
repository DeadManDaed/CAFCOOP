<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2E7D32">
    <title>CAFCOOP - Application Mobile Agricole</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

    <!-- Contrôles de démonstration -->
    <div class="demo-controls">
        <button class="switch-role" onclick="toggleRole()">🔄 Changer Vue</button>
    </div>

    <!-- Cadre du téléphone -->
    <div class="phone-frame">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="app-title">
                    <span>🍃</span>
                    <span>CAFCOOP</span>
                </div>
                <div class="role-badge" id="current-role" onclick="toggleRole()">
                    AGRICULTEUR
                </div>
            </div>
        </header>

        <!-- Zone de contenu -->
        <main class="content-area" id="main-content">
            <!-- Écran de chargement initial -->
            <div class="loading">
                <div class="spinner"></div>
                <p>Chargement de CAFCOOP...</p>
            </div>
        </main>

        <!-- FAB (Floating Action Button) -->
        <div class="fab" id="fab-action" onclick="fabAction()">📸</div>

        <!-- Résumé du panier -->
        <div id="cart-summary">
            <div>
                <span class="cart-count" id="cart-count">0</span>
                <span style="margin-left: 8px;">article(s)</span>
            </div>
            <div>
                <strong id="cart-total">0 FCFA</strong>
            </div>
            <button class="btn btn-secondary" onclick="viewCart()" style="width: auto; padding: 8px 16px; margin: 0;">
                Voir le panier
            </button>
        </div>

        <!-- Navigation -->
        <nav class="bottom-nav">
            <div class="nav-item active" onclick="navigateTo('home')" data-tab="home">
                <span class="nav-icon">🏠</span>
                <span>Accueil</span>
            </div>
            <div class="nav-item" onclick="navigateTo('boutique')" data-tab="boutique">
                <span class="nav-icon">🛒</span>
                <span>Boutique</span>
            </div>
            <div class="nav-item" onclick="navigateTo('diagnostic')" data-tab="diagnostic">
                <span class="nav-icon">🩺</span>
                <span>Diagnostic</span>
            </div>
            <div class="nav-item" onclick="navigateTo('profil')" data-tab="profil">
                <span class="nav-icon">👤</span>
                <span>Profil</span>
            </div>
        </nav>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content" id="modal-content">
            <!-- Contenu dynamique -->
        </div>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification"></div>

    <!-- SUPABASE : Import via CDN ES Module -->
    <script src="./supabase-client.js"></script>
    <script src="./cafcoop_app_1.js"></script>

</body>
</html>
